name: Android Release CI

# Инструкция запуска: теперь только при пуше тегов, соответствующих маске v* (например v0.7, v1.0.0)
on:
  push:
#    branches: [ "main", "master" ]
    tags:
      - 'v*'
#  pull_request:
#    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    # НОВЫЙ ШАГ: Воссоздаем секретную папку и файл google-services.json
    - name: Decode Google Services JSON
      env:
        GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_BASE64 }}
      run: |
        # 1. Создаем папку _secrets_ на один уровень выше корня проекта
        mkdir -p ../_secrets_

        # 2. Декодируем строку из секретов GitHub наружу в файл
        echo "$GOOGLE_SERVICES_SECRET" | base64 --decode > ../_secrets_/google-services.json

    - name: Run Unit Tests
      run: ./gradlew test

    - name: Build Debug APK
      run: ./gradlew :chatapp:assembleDebug

    - name: Extract Android App Version
      id: get_version
      run: |
        VERSION_NAME=$(grep "versionName" chatapp/build.gradle* | head -n 1 | sed -E 's/.*versionName\s*=\s*["'\'']([^"'\'']+)["'\'']/\1/')
        if [ -z "$VERSION_NAME" ]; then VERSION_NAME="0.1-unknown"; fi
        echo "APP_VERSION=$VERSION_NAME" >> $GITHUB_ENV
        echo "Фиксируем версию приложения: $VERSION_NAME"

      # ИСПРАВЛЕНО: Автоматический поиск любого сгенерированного debug APK
    - name: Find and Rename APK
      run: |
        # Ищем файл .apk в папке сборки модуля chatapp
        FOUND_APK=$(find chatapp/build/outputs/apk/debug -name "*.apk" | head -n 1)
        if [ -z "$FOUND_APK" ]; then
          echo "Ошибка: APK файл не найден в папке сборки!"
          exit 1
        fi
        echo "Найден файл: $FOUND_APK"
        # Копируем его в корень рабочей директории с новым именем
        cp "$FOUND_APK" ./chatapp-v$APP_VERSION.apk

      # ИСПРАВЛЕНО: Загружаем файл из корня рабочей директории
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        body: "Автоматический релиз для версии $APP_VERSION, собранный по тегу ${{ github.ref_name }}. Успешно пройдены сборка модуля chatapp и тестирование."
        draft: false
        prerelease: false
        # Путь теперь ведет на файл, скопированный в корень
        files: ./chatapp-v${{ env.APP_VERSION }}.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        APP_VERSION: ${{ env.APP_VERSION }}
